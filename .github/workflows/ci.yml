name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + DB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: airline
          POSTGRES_PASSWORD: airline
          POSTGRES_DB: airline
        ports:
          - 5432:5432
        volumes:
          - ${{ github.workspace }}/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
          - ${{ github.workspace }}/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
        options: >-
          --health-cmd "pg_isready -U airline -d airline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://airline:airline@localhost:5432/airline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-backend/requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q python-backend scripts eval
      - name: Run tests
        run: python -m pytest -q
